server:
  port: 8080

spring:
  application:
    name: geo-backend

  datasource:
    url: jdbc:mysql://localhost:3306/geo_backend?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: geo
    password: geo123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 10s

  rabbitmq:
    host: localhost
    port: 5672
    username: geo
    password: geo123
    virtual-host: /
    connection-timeout: 10s
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 5
        max-concurrency: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/**/*.xml

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: geo-bucket
  public-endpoint: http://localhost:9000

logging:
  level:
    com.geo: DEBUG
    org.springframework.amqp: INFO

geo:
  rpa:
    max-retry-count: 3
    request-timeout-ms: 120000
    rate-limit:
      max-requests-per-minute: 60